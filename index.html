<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Primer Juego de Ajedrez</title>
    <style>
        /* --- 1. ESTILOS VISUALES (CSS) --- */
        /* Configuramos el fondo de la página y centramos los elementos */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50; /* Color de fondo oscuro */
            color: white;
            margin-top: 20px;
        }

        /* Estilo del cartel que dice de quién es el turno */
        #indicador-turno {
            font-size: 22px;
            margin-bottom: 15px;
            background-color: #34495e;
            padding: 8px 20px;
            border-radius: 8px;
        }

        /* Creamos la cuadrícula de 8 columnas por 8 filas */
        #tablero {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 5px solid #1a252f;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        /* Diseño de cada una de las 64 casillas */
        .casilla {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            user-select: none;
        }

        /* Colores de las casillas claras y oscuras */
        .clara { background-color: #eeeed2; color: black; }
        .oscura { background-color: #769656; color: black; }

        /* Color amarillo cuando seleccionamos una pieza */
        .seleccionada {
            background-color: #f6f669 !important;
        }

        /* Estilo del botón para reiniciar el juego */
        #boton-reiniciar {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #boton-reiniciar:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <!-- --- 2. ESTRUCTURA DE LA PÁGINA (HTML) --- -->
    <h1>Mi Juego de Ajedrez</h1>
    <div id="indicador-turno">Turno de: Blancas</div>
    
    <!-- Contenedor vacío donde JavaScript creará las casillas -->
    <div id="tablero"></div>

    <!-- Botón para volver a empezar -->
    <button id="boton-reiniciar" onclick="reiniciarJuego()">Reiniciar Partida</button>

    <script>
        /* --- 3. LÓGICA DEL JUEGO (JAVASCRIPT) --- */

        // Diccionario con los símbolos visuales de cada pieza
        // Mayúsculas = Blancas | Minúsculas = Negras
        const simbolosPiezas = {
            'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
            'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
        };

        // Variables que guardan el estado actual de la partida
        let estadoTablero = [];
        let turnoBlancas = true;
        let casillaSeleccionada = null;

        const contenedorTablero = document.getElementById('tablero');
        const textoTurno = document.getElementById('indicador-turno');

        // Función que coloca todas las piezas en su posición original
        function iniciarPosiciones() {
            estadoTablero = [
                ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
                ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
                ['',  '',  '',  '',  '',  '',  '',  ''],
                ['',  '',  '',  '',  '',  '',  '',  ''],
                ['',  '',  '',  '',  '',  '',  '',  ''],
                ['',  '',  '',  '',  '',  '',  '',  ''],
                ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
                ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
            ];
        }

        // Función auxiliar para saber si una pieza es del equipo Blanco
        function esPiezaBlanca(pieza) {
            return pieza !== '' && pieza === pieza.toUpperCase();
        }

        // Función que construye visualmente las 64 casillas en la pantalla
        function dibujarTablero() {
            contenedorTablero.innerHTML = ''; // Borramos el dibujo anterior

            for (let fila = 0; fila < 8; fila++) {
                for (let col = 0; col < 8; col++) {
                    const casilla = document.createElement('div');
                    casilla.classList.add('casilla');

                    // Alternamos los colores claro y oscuro
                    if ((fila + col) % 2 === 0) {
                        casilla.classList.add('clara');
                    } else {
                        casilla.classList.add('oscura');
                    }

                    // Si la casilla está seleccionada por el jugador, la pintamos de amarillo
                    if (casillaSeleccionada && casillaSeleccionada.fila === fila && casillaSeleccionada.col === col) {
                        casilla.classList.add('seleccionada');
                    }

                    // Dibujamos la pieza correspondiente si la casilla no está vacía
                    const codigoPieza = estadoTablero[fila][col];
                    if (codigoPieza !== '') {
                        casilla.textContent = simbolosPiezas[codigoPieza];
                    }

                    // Le decimos a la casilla que escuche cuando alguien haga clic en ella
                    casilla.addEventListener('click', () => manejarClic(fila, col));

                    contenedorTablero.appendChild(casilla);
                }
            }
        }

        // Función que decide qué pasa cuando haces clic en una coordenada (fila, columna)
        function manejarClic(fila, col) {
            const piezaEnCasilla = estadoTablero[fila][col];

            // Si aún no hay pieza seleccionada, intentamos seleccionar una
            if (casillaSeleccionada === null) {
                if (piezaEnCasilla === '') return; // No seleccionamos casillas vacías

                // Solo permitimos seleccionar piezas del turno correspondiente
                if (turnoBlancas && esPiezaBlanca(piezaEnCasilla)) {
                    casillaSeleccionada = { fila, col };
                } else if (!turnoBlancas && !esPiezaBlanca(piezaEnCasilla)) {
                    casillaSeleccionada = { fila, col };
                }
            } else {
                // Si ya teníamos una pieza seleccionada, vemos a dónde quiere ir
                const filaOrigen = casillaSeleccionada.fila;
                const colOrigen = casillaSeleccionada.col;
                const piezaQueSeMueve = estadoTablero[filaOrigen][colOrigen];

                // Si toca otra pieza de su propio color, cambiamos la selección
                if (piezaEnCasilla !== '' && esPiezaBlanca(piezaEnCasilla) === esPiezaBlanca(piezaQueSeMueve)) {
                    casillaSeleccionada = { fila, col };
                } else {
                    // Movemos la pieza a la casilla destino y vaciamos la de origen
                    estadoTablero[fila][col] = piezaQueSeMueve;
                    estadoTablero[filaOrigen][colOrigen] = '';

                    // Cambiamos el turno al otro jugador
                    turnoBlancas = !turnoBlancas;
                    textoTurno.textContent = turnoBlancas ? 'Turno de: Blancas' : 'Turno de: Negras';
                    casillaSeleccionada = null;
                }
            }

            dibujarTablero();
        }

        // Función para el botón de reinicio
        function reiniciarJuego() {
            turnoBlancas = true;
            casillaSeleccionada = null;
            textoTurno.textContent = 'Turno de: Blancas';
            iniciarPosiciones();
            dibujarTablero();
        }

        // Arrancamos el juego por primera vez
        reiniciarJuego();
    </script>
</body>
</html>
